<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Instrument+Sans:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0F1A18; } a:hover { color: #3A4A46; }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1350px; background: linear-gradient(168deg, #F5F2EC 0%, #EAE4DA 58%, #E2DACE 100%); overflow: hidden; font-family: 'Instrument Sans', system-ui, sans-serif;">

  <div style="position: absolute; top: -420px; right: -300px; width: 1200px; height: 1200px; border-radius: 50%; background: radial-gradient(circle at center, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 68%); pointer-events: none;"></div>

  <div style="position: relative; display: flex; flex-direction: column; justify-content: space-between; height: 100%; box-sizing: border-box; padding: 76px 76px 68px 76px;">

    <div style="display: flex; flex-direction: column; gap: 46px;">
      <div style="display: flex; align-items: center; gap: 15px;">
        <svg width="42" height="42" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1.5" y="1.5" width="41" height="41" rx="12" stroke="#0F1A18" stroke-width="2.5"/>
          <path d="M11 28.5C15.5 19 20 14.5 22 14.5C24 14.5 28.5 19 33 28.5" stroke="#0F1A18" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="22" cy="30.5" r="2.6" fill="#0F1A18"/>
        </svg>
        <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 29px; letter-spacing: 0.14em; color: #0F1A18;">VISTA</div>
      </div>

      <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 100px; line-height: 0.95; letter-spacing: -0.04em; color: #0F1A18; max-width: 920px;">Warranty,<br>without the<br>finance office.</div>
    </div>

    <div style="position: relative; align-self: center; width: 100%; display: flex; justify-content: center; align-items: flex-end; height: 430px;">
      <div style="position: absolute; bottom: 0; width: 620px; height: 132px; background: linear-gradient(180deg, #FBFAF7 0%, #E8E2D8 100%); border-radius: 20px; box-shadow: 0 30px 50px -22px rgba(60,50,35,0.35);"></div>
      <div style="position: absolute; bottom: 84px; width: 580px; height: 366px; background: radial-gradient(ellipse at 50% 90%, rgba(90,75,55,0.26) 0%, rgba(90,75,55,0) 62%); pointer-events: none;"></div>
      <div style="position: relative; bottom: 96px; width: 540px; height: 340px; transform: rotate(-4deg);">
        <div style="position: absolute; inset: 0; background: linear-gradient(145deg, #1B2422 0%, #0C1211 100%); border-radius: 24px; box-shadow: 0 44px 64px -20px rgba(40,32,22,0.55), inset 0 1px 0 rgba(255,255,255,0.1); border-bottom: 4px solid {{accent}}; box-sizing: border-box; padding: 38px 40px; display: flex; flex-direction: column; justify-content: space-between;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 0.14em; color: #F4F7F6;">VISTA</div>
            <div style="font-size: 18px; letter-spacing: 0.16em; color: {{accent}}; font-weight: 500;">APPOINTED AGENT</div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <div style="display: flex; gap: 10px; align-items: center;">
              <div style="width: 46px; height: 34px; border-radius: 6px; background: linear-gradient(135deg, #C8C3B4 0%, #8E897A 100%);"></div>
            </div>
            <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-size: 30px; letter-spacing: 0.06em; color: #DCE3E1; font-weight: 500;">[AGENT NAME]</div>
            <div style="font-size: 19px; letter-spacing: 0.1em; color: #78857F;">AUTO · UNLIMITED MILES</div>
          </div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 24px;">
      <div style="font-size: 30px; line-height: 1.45; color: #4A544F; max-width: 860px;">Your client skips the dealer markup — not the coverage. They sign online in under 60 seconds.</div>
      <div style="display: flex; align-items: center; justify-content: space-between; background: #0F1A18; border-radius: 16px; padding: 30px 40px;">
        <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 33px; color: #F7F5F0; letter-spacing: -0.015em;">Become a Vista agent</div>
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 14H21M21 14L15 8M21 14L15 20" stroke="#F7F5F0" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div style="font-size: 17px; line-height: 1.5; color: #8A8478;">[LEGAL LINE — underwriter, state availability, licensing disclosure]</div>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#2FC2A8","options":["#2FC2A8","#4A9EF5","#E0A33E","#C9553F"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2FC2A8' };
  }
}
</script>
</body>
</html>
